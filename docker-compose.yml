services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: sumo
      POSTGRES_USER: sumo
      POSTGRES_PASSWORD: sumo
    volumes:
      - ./sumo_service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sumo -d sumo"]
      interval: 5s
      timeout: 5s
      retries: 10

  sumo-service:
    build:
      context: ./sumo_service
      dockerfile: Dockerfile
    environment:
      PREDICTION_URL: ${PREDICTION_URL:-https://module3-ml.onrender.com/predict}
      PREDICTION_API_KEY: ${PREDICTION_API_KEY:-}
      DEMAND_SOURCE: ${DEMAND_SOURCE:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
