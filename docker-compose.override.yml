services:
  sumo-service:
    volumes:
      - ./sumo_service/app:/app/app
      - ./sumo_service/sumo_configs:/app/sumo_configs
    # 수요 예측 등 환경변수를 sumo_service/.env로 관리. 파일이 없어도 무시(required:false).
    # 아래 environment: 항목이 .env보다 우선한다.
    env_file:
      - path: ./sumo_service/.env
        required: false
    environment:
      - WATCHFILES_FORCE_POLLING=true
      - PASSENGER_SOURCE=random
      - DATABASE_URL=postgresql://sumo:sumo@postgres:5432/sumo
      # Simulation tuning (defaults match code)
      - SIM_DURATION=604800     # 1-week simulation
      - SIMULATION_SPEED=20     # sim-seconds per real-second (higher=faster run)
      - N_TAXIS=300
      - PASSENGER_LAMBDA=5      # Poisson λ per spawn interval
    command:
      [
        "uv", "run", "uvicorn", "app.main:app",
        "--host", "0.0.0.0",
        "--port", "8080",
        "--reload"
      ]
